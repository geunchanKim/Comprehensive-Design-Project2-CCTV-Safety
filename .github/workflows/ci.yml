# PR마다 백엔드·엣지 테스트를 자동으로 돌린다.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  backend-test:
    name: backend-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"          # backend/Dockerfile 과 같은 버전
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 의존성 설치
        run: pip install -r backend/requirements.txt

      - name: 테스트
        env:
          DATABASE_URL: sqlite:///./test_cctv.db
        run: python -m pytest backend/tests -q

  backend-postgres-test:
    name: backend-postgres-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cctv_test
          POSTGRES_PASSWORD: cctv_test
          POSTGRES_DB: cctv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cctv_test -d cctv_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://cctv_test:cctv_test@localhost:5432/cctv_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Verify complete migration history and dashboard rollback
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m alembic check
          python -m alembic downgrade 0010
          python -m alembic upgrade head
          python -m alembic check
      - name: Test backend with PostgreSQL
        run: python -m pytest backend/tests -q

  edge-test:
    name: edge-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # YOLO·torch는 무거워서 설치하지 않는다. 그것 없이 도는 부분만 검사
      - name: 의존성 설치
        run: pip install numpy opencv-python-headless requests pytest

      - name: 문법 검사 (ai/ 전체)
        run: python -m compileall -q ai/edge ai/eval ai/tools

      - name: 테스트
        run: python -m pytest ai/tests -q

  frontend-test:
    name: frontend-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 빌드
        run: npm run build

      - name: 린트
        run: npm run lint
