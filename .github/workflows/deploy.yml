# develop에 병합(push)되면 테스트 후 실습 서버에 백엔드를 자동 배포한다.
name: Deploy

on:
  push:
    branches: [develop]
  workflow_dispatch:            # Actions 탭에서 손으로 다시 배포

concurrency:
  group: deploy
  cancel-in-progress: false     # 배포는 겹치지 않게 차례로

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: 백엔드 테스트
        env:
          DATABASE_URL: sqlite:///./test_cctv.db
        run: python -m pytest backend/tests -q

  deploy:
    needs: test                 # 테스트가 통과해야 배포
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHA: ${{ github.sha }}
      BACKEND_URL: http://121.182.60.2:32130
    steps:
      - name: SSH 키 준비
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: 서버에 배포
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          cat > remote.sh <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          git fetch origin develop
          git checkout -B develop origin/develop
          git reset --hard "$SHA"
          export APP_COMMIT_SHA=$(git rev-parse --short HEAD)
          echo "배포 커밋: $APP_COMMIT_SHA"
          cd infra
          docker compose up -d --build backend
          REMOTE

          # 접속 실패(코드 255)만 다시 시도, 배포 명령 실패는 바로 실패 처리
          for i in 1 2 3; do
            set +e
            ssh -i ~/.ssh/deploy_key -p "$PORT" -o ConnectTimeout=20 -o ServerAliveInterval=15 \
              "$USER@$HOST" "DEPLOY_PATH='$DEPLOY_PATH' SHA='$SHA' bash -s" < remote.sh
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then exit 0; fi
            if [ "$code" -ne 255 ]; then echo "배포 명령 실패 (코드 $code)"; exit "$code"; fi
            echo "서버 접속 실패, 10초 뒤 다시 시도 ($i/3)"; sleep 10
          done
          echo "서버에 3번 모두 접속하지 못함"; exit 1

      - name: 서버 응답 확인
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "$BACKEND_URL/health"; then echo; echo "배포 성공"; exit 0; fi
            echo "대기 중... ($i/12)"; sleep 5
          done
          echo "1분 동안 /health 응답 없음"; exit 1
