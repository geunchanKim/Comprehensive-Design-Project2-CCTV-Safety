<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">CCTV Safety AI — from pixels to position</title>
  <desc id="desc">Concept illustration of two camera inputs, YOLO detection and pose estimation, calibration, and server delivery. This is not an actual detection screenshot.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1225"/><stop offset="1" stop-color="#123b4b"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#63d9d0" stroke-opacity=".08"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#5eead4"/></marker>
  </defs>
  <rect width="1200" height="460" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="460" rx="24" fill="url(#grid)"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="56" y="56" fill="#5eead4" font-size="14" font-weight="700" letter-spacing="3">CCTV SAFETY / AI MODULE</text>
    <text x="56" y="116" fill="#f1f5f9" font-size="46" font-weight="750">From pixels to position.</text>
    <text x="58" y="151" fill="#b4c9dd" font-size="19">Two cameras. Detection. Pose. Calibrated geometry.</text>
    <g transform="translate(58 194)">
      <rect width="324" height="206" rx="16" fill="#0b1729" stroke="#34536a"/>
      <path d="M20 180L162 84L304 180M20 180H304M65 150H259M110 120H214M162 84V190" fill="none" stroke="#284d60"/>
      <rect x="26" y="20" width="78" height="25" rx="6" fill="#18374a"/>
      <text x="39" y="37" fill="#a5f3fc" font-size="12">CAM 01 / 02</text>
      <rect x="132" y="55" width="68" height="126" rx="5" fill="#5eead4" fill-opacity=".05" stroke="#5eead4" stroke-width="2"/>
      <circle cx="166" cy="78" r="12" fill="none" stroke="#dbeafe" stroke-width="3"/>
      <path d="M166 91V130M144 110L166 99L188 110M166 130L150 169M166 130L181 169" fill="none" stroke="#dbeafe" stroke-width="3" stroke-linecap="round"/>
      <g fill="#5eead4"><circle cx="150" cy="169" r="5"/><circle cx="181" cy="169" r="5"/></g>
      <text x="214" y="82" fill="#5eead4" font-size="12">person</text>
      <text x="214" y="101" fill="#91a9bf" font-size="12">track + pose</text>
    </g>
    <path d="M402 296H454" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(476 210)">
      <rect width="290" height="70" rx="12" fill="#15263c" stroke="#34536a"/>
      <text x="20" y="29" fill="#f1f5f9" font-size="18" font-weight="700">01 / Detect + track</text>
      <text x="20" y="51" fill="#a8bed1" font-size="14">YOLO11n · ByteTrack · ankle keypoints</text>
      <rect y="90" width="290" height="70" rx="12" fill="#15263c" stroke="#34536a"/>
      <text x="20" y="119" fill="#f1f5f9" font-size="18" font-weight="700">02 / Calibrate + evaluate</text>
      <text x="20" y="141" fill="#a8bed1" font-size="14">ChArUco · replay packs · timing logs</text>
    </g>
    <path d="M787 296H837" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="858" y="210" width="284" height="160" rx="16" fill="#103b42" stroke="#3d9d9c"/>
    <text x="881" y="245" fill="#5eead4" font-size="13" letter-spacing="2">SERVER HANDOFF</text>
    <text x="881" y="283" fill="#f1f5f9" font-size="24" font-weight="700">Detection bundles</text>
    <text x="881" y="315" fill="#b4c9dd" font-size="15">Camera IDs · pixel coordinates</text>
    <text x="881" y="340" fill="#b4c9dd" font-size="15">Server → world [X, Y, Z] in meters</text>
    <text x="58" y="434" fill="#7795aa" font-size="12" letter-spacing="1">PIPELINE CONCEPT / NOT A LIVE DETECTION FRAME</text>
  </g>
</svg>
