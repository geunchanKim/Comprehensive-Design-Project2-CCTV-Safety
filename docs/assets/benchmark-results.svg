<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">CCTV Safety benchmark results</title>
  <desc id="desc">Comparison of baseline, calibration, matching, and combined methods for localization success and positions within 15 centimeters.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102a43"/>
      <stop offset="1" stop-color="#0c2236"/>
    </linearGradient>
    <linearGradient id="best" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35c9b5"/>
      <stop offset="1" stop-color="#69e5aa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020b13" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1100" height="430" rx="24" fill="#071426"/>
  <text x="48" y="51" fill="#f5fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">Ablation benchmark</text>
  <text x="48" y="78" fill="#89a9ba" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Real CCTV · 107 people · same recordings and detections across all conditions</text>

  <g transform="translate(48 108)" filter="url(#shadow)">
    <rect width="490" height="274" rx="18" fill="url(#panel)" stroke="#244b63"/>
    <text x="24" y="37" fill="#dcecf3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">Localization success</text>
    <text x="446" y="37" text-anchor="end" fill="#6f93a5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">%</text>

    <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">
      <text x="24" y="82" fill="#abc4cf">Baseline</text>
      <rect x="112" y="66" width="306" height="22" rx="6" fill="#496477"/>
      <text x="430" y="82" fill="#d9e6eb" font-weight="700">85.0</text>

      <text x="24" y="128" fill="#abc4cf">C</text>
      <rect x="112" y="112" width="337" height="22" rx="6" fill="#4b8ec7"/>
      <text x="461" y="128" fill="#d9e6eb" font-weight="700">93.5</text>

      <text x="24" y="174" fill="#abc4cf">M</text>
      <rect x="112" y="158" width="360" height="22" rx="6" fill="#35b9bd"/>
      <text x="460" y="174" text-anchor="end" fill="#e8fffd" font-weight="700">100</text>

      <text x="24" y="220" fill="#ffffff" font-weight="700">C+M</text>
      <rect x="112" y="204" width="360" height="22" rx="6" fill="url(#best)"/>
      <text x="460" y="220" text-anchor="end" fill="#062d2b" font-weight="800">100</text>
    </g>
    <text x="24" y="255" fill="#69e5aa" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600">+15.0%p vs. baseline · 16 more people located</text>
  </g>

  <g transform="translate(562 108)" filter="url(#shadow)">
    <rect width="490" height="274" rx="18" fill="url(#panel)" stroke="#244b63"/>
    <text x="24" y="37" fill="#dcecf3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">Position error within 15 cm</text>
    <text x="446" y="37" text-anchor="end" fill="#6f93a5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">%</text>

    <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">
      <text x="24" y="82" fill="#abc4cf">Baseline</text>
      <rect x="112" y="66" width="303" height="22" rx="6" fill="#496477"/>
      <text x="427" y="82" fill="#d9e6eb" font-weight="700">84.1</text>

      <text x="24" y="128" fill="#abc4cf">C</text>
      <rect x="112" y="112" width="327" height="22" rx="6" fill="#4b8ec7"/>
      <text x="451" y="128" fill="#d9e6eb" font-weight="700">90.7</text>

      <text x="24" y="174" fill="#abc4cf">M</text>
      <rect x="112" y="158" width="330" height="22" rx="6" fill="#35b9bd"/>
      <text x="454" y="174" fill="#d9e6eb" font-weight="700">91.6</text>

      <text x="24" y="220" fill="#ffffff" font-weight="700">C+M</text>
      <rect x="112" y="204" width="347" height="22" rx="6" fill="url(#best)"/>
      <text x="447" y="220" text-anchor="end" fill="#062d2b" font-weight="800">96.3</text>
    </g>
    <text x="24" y="255" fill="#69e5aa" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600">+12.2%p vs. baseline</text>
  </g>

  <g transform="translate(760 406)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">
    <circle cx="0" cy="0" r="5" fill="#4b8ec7"/><text x="11" y="4" fill="#8fabba">C: calibration</text>
    <circle cx="118" cy="0" r="5" fill="#35b9bd"/><text x="129" y="4" fill="#8fabba">M: matching</text>
  </g>
</svg>
