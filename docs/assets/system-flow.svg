<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="432" viewBox="0 0 1200 432" role="img" aria-labelledby="title desc">
<title id="title">Camera-to-dashboard architecture</title><desc id="desc">Two cameras feed edge detection and tracking, FastAPI stores positions and alerts, React polls snapshot, cameras and alerts independently.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#68849b"/></marker></defs>
<rect width="1200" height="432" rx="22" fill="#0e1926"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="36" y="44" fill="#65dacb" font-size="15" font-weight="700">FROM CAMERA TO CONTROL ROOM</text><text x="36" y="80" fill="#f0f6fc" font-size="28" font-weight="700">One pipeline. Three independent status feeds.</text><rect x="36" y="112" width="264" height="148" rx="16" fill="#142535" stroke="#294357"/><text x="56" y="141" fill="#65dacb" font-size="13" font-weight="700">01 / INPUT</text><text x="56" y="177" fill="#f0f6fc" font-size="23" font-weight="600">Two cameras</text><text x="56" y="209" fill="#a9bdce" font-size="14" font-weight="400">RTSP / video / folder</text><text x="56" y="237" fill="#a9bdce" font-size="14" font-weight="400">Synchronized frame pairs</text><rect x="324" y="112" width="264" height="148" rx="16" fill="#142535" stroke="#294357"/><text x="344" y="141" fill="#65dacb" font-size="13" font-weight="700">02 / EDGE</text><text x="344" y="177" fill="#f0f6fc" font-size="23" font-weight="600">Detect + track</text><text x="344" y="209" fill="#a9bdce" font-size="14" font-weight="400">YOLO11 + pose + ByteTrack</text><text x="344" y="237" fill="#a9bdce" font-size="14" font-weight="400">Queue freshness + heartbeat</text><rect x="612" y="112" width="264" height="148" rx="16" fill="#142535" stroke="#294357"/><text x="632" y="141" fill="#65dacb" font-size="13" font-weight="700">03 / SERVER</text><text x="632" y="177" fill="#f0f6fc" font-size="23" font-weight="600">Locate + persist</text><text x="632" y="209" fill="#a9bdce" font-size="14" font-weight="400">Match / triangulate / zones</text><text x="632" y="237" fill="#a9bdce" font-size="14" font-weight="400">PostgreSQL + durable alerts</text><rect x="900" y="112" width="264" height="148" rx="16" fill="#142535" stroke="#294357"/><text x="920" y="141" fill="#65dacb" font-size="13" font-weight="700">04 / FRONTEND</text><text x="920" y="177" fill="#f0f6fc" font-size="23" font-weight="600">Observe + ack</text><text x="920" y="209" fill="#a9bdce" font-size="14" font-weight="400">React + TypeScript</text><text x="920" y="237" fill="#a9bdce" font-size="14" font-weight="400">500 ms HTTP polling</text><path d="M303 186H319" stroke="#68849b" stroke-width="2" marker-end="url(#arrow)"/><path d="M591 186H607" stroke="#68849b" stroke-width="2" marker-end="url(#arrow)"/><path d="M879 186H895" stroke="#68849b" stroke-width="2" marker-end="url(#arrow)"/><rect x="36" y="284" width="1128" height="88" rx="16" fill="#102b35" stroke="#294357"/><text x="58" y="313" fill="#65dacb" font-size="12" font-weight="700">DATA CONTRACT</text><text x="58" y="343" fill="#f0f6fc" font-size="18" font-weight="400">snapshot: position + zones</text><text x="420" y="343" fill="#f0f6fc" font-size="18" font-weight="400">cameras: heartbeat + frames</text><text x="826" y="343" fill="#f0f6fc" font-size="18" font-weight="400">alerts: lifecycle + ack</text><text x="36" y="405" fill="#a9bdce" font-size="15" font-weight="400">Live ingestion: baseline   /   Improved: session recompute   /   SSE: server endpoint available</text></g></svg>
