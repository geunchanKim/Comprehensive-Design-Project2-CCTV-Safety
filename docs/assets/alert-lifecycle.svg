<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="402" viewBox="0 0 1200 402" role="img" aria-labelledby="title desc">
<title id="title">Alert escalation and acknowledgement</title><desc id="desc">Warning and danger retain one ID; escalation resets acknowledgement; ended unacknowledged danger stays visible until acknowledged. An active hazard is not cleared by ack.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#68849b"/></marker></defs>
<rect width="1200" height="402" rx="22" fill="#0e1926"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="36" y="44" fill="#65dacb" font-size="15" font-weight="700">ALERT LIFECYCLE</text><text x="36" y="80" fill="#f0f6fc" font-size="28" font-weight="700">Stable identity. Explicit acknowledgement.</text><rect x="36" y="120" width="264" height="132" rx="16" fill="#142535" stroke="#edcc7a"/><text x="54" y="153" fill="#edcc7a" font-size="17" font-weight="700">WARNING</text><text x="54" y="190" fill="#f0f6fc" font-size="18" font-weight="400">New alert ID</text><text x="54" y="222" fill="#a9bdce" font-size="14" font-weight="400">Acknowledgement allowed</text><rect x="324" y="120" width="264" height="132" rx="16" fill="#142535" stroke="#ed938e"/><text x="342" y="153" fill="#ed938e" font-size="17" font-weight="700">DANGER</text><text x="342" y="190" fill="#f0f6fc" font-size="18" font-weight="400">Same alert ID</text><text x="342" y="222" fill="#a9bdce" font-size="14" font-weight="400">Escalation requires new ack</text><rect x="612" y="120" width="264" height="132" rx="16" fill="#142535" stroke="#96b8ff"/><text x="630" y="153" fill="#96b8ff" font-size="17" font-weight="700">ENDED / UNACKED</text><text x="630" y="190" fill="#f0f6fc" font-size="18" font-weight="400">Danger stays visible</text><text x="630" y="222" fill="#a9bdce" font-size="14" font-weight="400">Object may already be gone</text><rect x="900" y="120" width="264" height="132" rx="16" fill="#142535" stroke="#65dacb"/><text x="918" y="153" fill="#65dacb" font-size="17" font-weight="700">ACKNOWLEDGED</text><text x="918" y="190" fill="#f0f6fc" font-size="18" font-weight="400">Ended alert leaves list</text><text x="918" y="222" fill="#a9bdce" font-size="14" font-weight="400">History stays in database</text><path d="M303 185H319" stroke="#68849b" stroke-width="2" marker-end="url(#arrow)"/><path d="M591 185H607" stroke="#68849b" stroke-width="2" marker-end="url(#arrow)"/><path d="M879 185H895" stroke="#68849b" stroke-width="2" marker-end="url(#arrow)"/><text x="36" y="290" fill="#a9bdce" font-size="16" font-weight="400">Example: warning escalates to danger, then ends before acknowledgement.</text><rect x="36" y="314" width="1128" height="60" rx="16" fill="#102b35" stroke="#294357"/><text x="58" y="351" fill="#d6e3ed" font-size="18" font-weight="400">ACK records an operator response. It does not clear an active hazard. Recurrence gets a new ID.</text></g></svg>